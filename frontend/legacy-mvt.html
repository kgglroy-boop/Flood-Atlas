<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑矢量瓦片 · Flood Atlas</title></head>
<body>
  <div class="mvt-workspace">
    <a class="skip-link" href="#mvt-map">跳到建筑地图</a>
    <header class="header">
      <a class="brand" href="/legacy.html" aria-label="Flood Atlas 情景地图首页">
        <svg class="brand-symbol" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M4 12c8-10 15 12 28 0M4 20c8-10 15 12 28 0M9 28c7-6 13 7 21-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Flood Atlas</span>
      </a>
      <nav class="primary-nav" aria-label="主导航"><a href="/legacy.html">情景地图</a><a href="/legacy-mvt.html" aria-current="page">矢量瓦片</a></nav>
    </header>
    <main class="mvt-shell">
      <div class="mvt-title"><h1>建筑矢量瓦片</h1><p>缩放街区，点选建筑核对编号与属性。</p></div>
      <section class="mvt-stage" aria-label="建筑矢量瓦片验证">
        <div class="mvt-toolbar"><strong id="mvt-state" role="status">正在加载建筑瓦片…</strong><span>EPSG:3857 · extent 4096 / buffer 64</span></div>
        <div class="mvt-demo-map" id="mvt-map" aria-label="建筑矢量瓦片地图" tabindex="-1"></div>
        <div class="mvt-note"><p id="mvt-feature" role="status">点击建筑，核对编号与属性。</p><button id="mvt-retry" type="button" hidden>重新加载</button></div>
      </section>
    </main>
    <footer class="footer"><span>虚构教学街区 · 200 栋建筑</span><span>MapLibre · FastAPI · PostGIS</span></footer>
  </div>
  <script type="module" src="/src/mvt-demo.ts"></script>
</body>
</html>

name: urban-flood-webgis

services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    entrypoint: ["/bin/sh", "/opt/project_scripts/require-password.sh", "POSTGRES_PASSWORD", "docker-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flood}
      POSTGRES_USER: ${POSTGRES_USER:-flood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/000_extensions.sql:/docker-entrypoint-initdb.d/999_project_extensions.sql:ro
      - ./scripts/require-password.sh:/opt/project_scripts/require-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$POSTGRES_PASSWORD\" != CHANGE_ME && pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1@sha256:0d8f286974707a6cce2d2b6d894b72a118dc10ee74b807e4cd0717c84200057a
    entrypoint: ["/bin/sh", "/opt/project_scripts/require-password.sh", "GEOSERVER_ADMIN_PASSWORD", "bash", "/opt/startup.sh"]
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      SKIP_DEMO_DATA: "true"
      INSTALL_EXTENSIONS: "false"
      EXTRA_JAVA_OPTS: "-Xms256m -Xmx1g"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      CORS_ALLOWED_METHODS: "GET,HEAD,OPTIONS"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
      - ./data/processed:/opt/project_data:ro
      - ./data/processed/case-library:/cases:ro
      - ./scripts/require-password.sh:/opt/project_scripts/require-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$GEOSERVER_ADMIN_PASSWORD\" != CHANGE_ME && curl --fail --silent --output /dev/null 'http://127.0.0.1:8080/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      additional_contexts:
        migrations: ./database
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-flood}
      POSTGRES_USER: ${POSTGRES_USER:-flood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLOOD_CASES_ROOT: /cases
      FLOOD_IMPORT_ROOT: /case-import
      FLOOD_IMPORT_TOKEN: ${FLOOD_IMPORT_TOKEN:-}
    volumes:
      - ./data/processed/case-library:/cases:ro
      - ./data/raw/case-jobs:/case-import
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).close()"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      GEOSERVER_PROXY_TARGET: http://geoserver:8080
    volumes:
      - ./data/processed/case-library:/app/public/cases:ro
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  case-worker:
    build:
      context: .
      dockerfile: case-worker/Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-flood}
      POSTGRES_USER: ${POSTGRES_USER:-flood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      FLOOD_CASES_ROOT: /cases
      FLOOD_IMPORT_ROOT: /case-import
    volumes:
      - ./data/processed/case-library:/cases
      - ./data/raw/case-jobs:/case-import
      - ./data/processed/cases/nyc-ida:/case-source:ro
    depends_on:
      db:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    init: true
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

volumes:
  pgdata:
  geoserver_data:

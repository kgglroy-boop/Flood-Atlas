# Explicitly opt in with -f docker-compose.yml -f docker-compose.rebuild.yml.
# !override requires Docker Compose >=2.24.4. Never appends production ports.
services:
  db:
    ports: !override ["127.0.0.1:15432:5432"]
  geoserver:
    ports: !override ["127.0.0.1:18080:8080"]
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:15173"
      EXTRA_JAVA_OPTS: "-Xms128m -Xmx768m"
  backend:
    ports: !override ["127.0.0.1:18000:8000"]
  frontend:
    ports: !override ["127.0.0.1:15173:5173"]
    environment:
      VITE_GEOSERVER_URL: "http://localhost:18080/geoserver"
